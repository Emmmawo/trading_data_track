name: daily-tracks

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      # 可选：DL 端点连通性快检，便于排障
      - name: Connectivity smoke test (DeFiLlama)
        run: |
          set -e
          mkdir -p docs/debug
          echo "RWA total:" && curl -sS https://api.llama.fi/charts/rwa | head -c 300 > docs/debug/rwa.json || true
          echo "Stable overview:" && curl -sS https://stablecoins.llama.fi/overview | head -c 300 > docs/debug/stable_overview.json || true
          echo "DeFi overview:" && curl -sS "https://api.llama.fi/overview/defi?excludeTotalChart=false&excludeProtocolChart=true&dataType=daily" | head -c 300 > docs/debug/defi_overview.json || true

      - name: Run tracks
        run: python -m scripts.run_tracks --config config/tracks.yml

      - name: Build index page
        run: python -m scripts.build_index --docs docs/tracks

      - name: Commit and push docs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git commit -m "daily update $(date -u +%F)" || echo "no changes"
          git push

      - name: Send Email with links (Gmail app password)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from:    ${{ secrets.GMAIL_USER }}
          to:      ${{ secrets.GMAIL_USER }}
          subject: "Daily Crypto Tracks Report"
          html_body: |
            <p>Tracks report (GitHub Pages):</p>
            <ul>
              <li><a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tracks/Chains%20(TVL).html">Chains (TVL)</a></li>
              <li><a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tracks/Stablecoins.html">Stablecoins</a></li>
              <li><a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tracks/DeFi%20-%20Total.html">DeFi - Total</a></li>
              <li><a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tracks/RWA.html">RWA</a></li>
            </ul>
            <p>Full index: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/</p>
