global:
  lookback_days: 1095
  top_k: 5
  output_dir: "docs/tracks"

tracks:
  - name: Chains (TVL)
    metric: tvl
    source: defillama_chains
    selection:
      whitelist: ["Ethereum","Tron","BSC","Arbitrum","Solana","Base","Optimism"]
    plot: {}

  - name: Stablecoins
    metric: supply_usd
    source: defillama_stablecoins
    selection:
      blacklist_symbols: ["UST"]

  - name: DeFi - Total
    metric: tvl
    source: defillama_defi_total
    selection: { mode: total }

  - name: RWA
    metric: tvl
    source: defillama_rwa
    selection: { mode: rwa_projects }
